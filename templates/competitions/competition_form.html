{% extends 'base_competition.html' %}

{% block title %}{{ title }} — iSwim{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'competition_list' %}" class="text-muted small">
        <i class="fas fa-arrow-left me-1"></i>Назад к соревнованиям
    </a>
    <h1 class="mt-2 mb-1">{{ title }}</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-trophy me-2"></i>{{ title }}
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3 {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
                        <label class="{% if field.field.widget.input_type == 'checkbox' %}form-check-label{% else %}form-label fw-semibold{% endif %}"
                               for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-save me-2"></i>Сохранить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
