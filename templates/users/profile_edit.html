{% extends 'base.html' %}

{% block title %}Редактирование профиля — iSwim{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <a href="{% url 'profile' %}" class="text-muted small">
            <i class="fas fa-arrow-left me-1"></i>Назад в кабинет
        </a>
        <h1 class="mt-3 mb-4">Редактирование профиля</h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-save me-2"></i>Сохранить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
